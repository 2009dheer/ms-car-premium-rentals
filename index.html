<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="description" content="MS CAR Premium Transport. Book cars, SUVs, Tempo Travellers, and luxury buses for outstation and local transit in Mumbai. Direct Fleet Owner." />
    <meta name="keywords" content="Car Hire, Tempo Traveller Booking, Luxury Bus Hire, Outstation Cab, Local Transit, Corporate Travel" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <title>MS CAR | Premium Transport</title>
    <!-- Structured Data for Google Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MS CAR",
      "url": "https://mscar.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mscar.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "Featured Fleet",
          "url": "https://mscar.in/fleet"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "Car & SUV Hire",
          "url": "https://mscar.in/fleet/cars"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "Tempo Traveller",
          "url": "https://mscar.in/fleet/tempos"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "Bus & Coach Hire",
          "url": "https://mscar.in/fleet/buses"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 5,
          "name": "Contact Us",
          "url": "https://mscar.in/contact"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { StrictMode, createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import App from './src/App.tsx';
      import './src/index.css';

      createRoot(document.getElementById('root')).render(
        createElement(StrictMode, null, createElement(App))
      );
    </script>
  </body>
</html>
